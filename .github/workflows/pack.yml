name: pack

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: linux deps
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
      - name: pack
        working-directory: apps/desktop
        run: |
          npm ci
          npm run pack
      - name: checksums
        working-directory: apps/desktop/release
        run: sha256sum LoLTerm-*-linux-*.deb > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lolterm-linux
          path: |
            apps/desktop/release/LoLTerm-*-linux-*.deb
            apps/desktop/release/SHA256SUMS.txt
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/LoLTerm-*-linux-*.deb
            apps/desktop/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
