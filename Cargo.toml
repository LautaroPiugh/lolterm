[workspace]
members = ["crates/core"]
resolver = "2"

[workspace.package]
version = "0.16.0"
edition = "2024"
description = "Local-first terminal workspace and graphical terminal multiplexer"
license = "MIT"
repository = "https://github.com/LautaroPiugh/lolterm"
homepage = "https://github.com/LautaroPiugh/lolterm"
readme = "README.md"


[workspace.dependencies]
color-eyre = "0.6.5"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.4"
